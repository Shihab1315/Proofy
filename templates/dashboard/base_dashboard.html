<!-- templates/dashboard/base_dashboard.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} | Proofly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="bg-[#F8FAFC] text-[#101828] font-sans antialiased overflow-hidden flex h-screen">

    <!-- Sidebar Include -->
    {% include 'dashboard/includes/sidebar.html' %}

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300 opacity-0 md:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0 transition-all duration-300" id="main-wrapper">
        
        <!-- Topbar Include -->
        {% include 'dashboard/includes/topbar.html' %}

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'js/dashboard.js' %}"></script>
    <script>
        lucide.createIcons();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
