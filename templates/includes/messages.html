{% if messages %}
<div class="fixed top-20 right-4 z-50 flex flex-col gap-2">
    {% for message in messages %}
    <div class="fade-in px-4 py-3 rounded-lg shadow-lg border text-sm font-medium flex items-center gap-2
        {% if message.tags == 'success' %} bg-emerald-50 text-emerald-800 border-emerald-200
        {% elif message.tags == 'error' %} bg-red-50 text-red-800 border-red-200
        {% else %} bg-blue-50 text-blue-800 border-blue-200 {% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
<script>
    // Auto hide messages after 4 seconds
    setTimeout(() => {
        document.querySelectorAll('.fade-in').forEach(el => {
            el.style.transition = 'opacity 0.5s ease';
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 500);
        });
    }, 4000);
</script>
{% endif %}
